name: PMP Paints - Windows Desktop Installer & Auto-Update Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      desktop_version:
        description: "Desktop Release Version (e.g. 18.0.0)"
        required: false
        default: ""
      publish_release:
        description: "Publish Windows installer & portable .exe to GitHub Releases"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-windows-desktop:
    name: Build & Verify Windows x64 Desktop Installer (.exe) + Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Repository Layout & Resolve Desktop Version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "web/package.json")) { throw "Missing web/package.json in workspace $(Get-Location)" }
          if (-not (Test-Path "desktop/package.json")) { throw "Missing desktop/package.json in workspace $(Get-Location)" }
          foreach ($asset in @("desktop/build/icon.ico", "desktop/build/icon.png", "desktop/build/tray-icon.png", "desktop/build/installer.nsh")) {
            if (-not (Test-Path $asset)) { throw "Missing required desktop build asset: $asset" }
          }
          $pkg = Get-Content -Raw -Path "desktop/package.json" | ConvertFrom-Json
          $baseVersion = [string]$pkg.version
          $inputVersion = "${{ github.event.inputs.desktop_version }}".Trim() -replace '^(desktop-)?v', ''
          $resolvedVersion = if ($inputVersion) { $inputVersion } else { $baseVersion }
          if ("${{ github.ref }}".StartsWith("refs/tags/desktop-v")) {
            $tagName = "${{ github.ref_name }}"
            $resolvedVersion = $tagName -replace '^desktop-v', ''
          } else {
            $tagName = "desktop-v$resolvedVersion"
          }
          "version=$resolvedVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Node: $(node --version) | npm: $(npm --version)"
          Write-Host "Resolved Desktop version: $resolvedVersion (tag: $tagName)"

      - name: Install Web Dependencies
        working-directory: web
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Desktop Dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply Desktop Version Override (If Requested)
        if: github.event.inputs.desktop_version != ''
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Web ERP Tests
        working-directory: web
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Shared Renderer & Verify Desktop Security Tests
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/sync-renderer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 NSIS Installer & Portable Executable
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          node node_modules/electron-builder/cli.js --win nsis portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Generated Windows Artifacts & SHA-256 Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distDir = "desktop/dist"
          $setupExe = Get-ChildItem -Path $distDir -Filter "*setup*.exe" | Select-Object -First 1
          $portableExe = Get-ChildItem -Path $distDir -Filter "*portable*.exe" | Select-Object -First 1
          if (-not $setupExe) { throw "Missing Windows NSIS installer (.exe) in $distDir" }
          if (-not $portableExe) { throw "Missing Windows Portable executable (.exe) in $distDir" }
          Get-ChildItem -Path $distDir -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "$($_.Name) -> $($_.Length) bytes -> SHA256: $hash"
          }

      - name: Upload Windows Desktop Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmp-paints-desktop-win-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Publish Separate Desktop Release on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "PMP PAINTS ERP Desktop (${{ steps.version.outputs.tag_name }})"
          body: |
            ### PMP PAINTS ERP — Windows x64 Desktop Release
            - Dedicated desktop channel (separate from Android `.apk` releases).
            - Connects 1:1 to the unified production Firebase database and accounts.
            - Includes NSIS Installer (`setup`) and Standalone Portable (`portable`) binaries.
          draft: false
          prerelease: false
          files: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
