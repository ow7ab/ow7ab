name: PMP Paints - Unified Web CI, Cloudflare Worker & GitHub Pages

on:
  push:
    branches:
      - "main"
    paths:
      - "web/**"
      - "public/**"
      - "wrangler.toml"
      - ".node-version"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pmp-web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy-web:
    name: Build, Test & Deploy Unified ERP Web Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies (Clean Lockfile)
        run: |
          npm ci --prefix web --no-audit --no-fund

      - name: Run TypeScript Type Verification
        run: |
          npm run typecheck --prefix web

      - name: Run All Web Automated Unit, RBAC & ERP Tests
        run: |
          npm test --prefix web

      - name: Build Production Bundle for Cloudflare Worker ow7ab (Root Base /)
        env:
          VITE_BASE_PATH: /
          SKIP_WEB_INSTALL: "true"
        run: |
          node web/scripts/build-production.mjs
          test -f web/dist/index.html
          test -f web/dist/_headers
          test -f web/dist/.assetsignore
          test ! -f web/dist/_redirects
          test -f web/dist/releases-history.json

      - name: Deploy to Cloudflare Worker ow7ab (Only when GitHub-managed deploy is explicitly enabled)
        if: vars.ENABLE_GITHUB_WORKER_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::ENABLE_GITHUB_WORKER_DEPLOY is true, but CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi
          npx --yes wrangler@4 deploy

      - name: Build Production Bundle for GitHub Pages (/ow7ab/)
        env:
          VITE_BASE_PATH: /ow7ab/
        run: |
          rm -rf web/dist-ghpages
          npm run build --prefix web -- --outDir dist-ghpages
          test -f web/dist-ghpages/index.html
          test -f web/dist-ghpages/404.html
          python3 - << 'PYEOF'
          import glob
          import os
          import shutil

          for apk_file in glob.glob(os.path.join("public", "*.apk")):
              if os.path.isfile(apk_file):
                  shutil.copy2(apk_file, os.path.join("web", "dist-ghpages", os.path.basename(apk_file)))

          for json_name in ("version.json", "releases-history.json"):
              src = os.path.join("public", json_name)
              if os.path.isfile(src):
                  shutil.copy2(src, os.path.join("web", "dist-ghpages", json_name))
          PYEOF
          if [ ! -f "web/dist-ghpages/pmp-paints-latest.apk" ]; then
            curl -fL "https://github.com/ow7ab/ow7ab/releases/latest/download/pmp-paints-latest.apk" -o "web/dist-ghpages/pmp-paints-latest.apk" || echo "Using direct release download stream."
          fi

      - name: Upload Unified Web Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-ghpages

      - name: Deploy Unified ERP & APK Website to GitHub Pages
        id: pages_deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
