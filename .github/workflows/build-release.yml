name: PMP Paints - Build & Release Signed APK

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "رقم البناء الجديد (versionCode) - يجب أن يكون أكبر من الإصدار السابق"
        required: true
        default: "14"
      version_name:
        description: "اسم الإصدار (versionName) مثل v3.1"
        required: true
        default: "v3.1"
      release_notes:
        description: "ملاحظات التحديث التي ستظهر للمستخدمين"
        required: false
        default: "إصدار v3.1: تحسينات إضافية شاملة على سلاسة التطبيق، دورة ERP المتكاملة، وتطوير نظام التحديثات السحابية."
      public_base_url:
        description: "رابط الاستضافة العامة الاختياري (يُستخدم GitHub Pages تلقائياً عند تركه فارغاً)"
        required: false
        default: ""
  repository_dispatch:
    types: [publish-apk-release]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build, Verify & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Required for AGP 9.1.1 & Android SDK Command-Line Tools)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Locate Android SDK & Verify sdkmanager Path
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ]; then
            sudo mkdir -p "$SDK_ROOT"
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT"
          else
            mkdir -p "$SDK_ROOT"
          fi

          SDKMANAGER_BIN=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_BIN=$(find "$SDK_ROOT/cmdline-tools" -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$FOUND_BIN" ] && [ -x "$FOUND_BIN" ]; then
              SDKMANAGER_BIN="$FOUND_BIN"
            fi
          fi

          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "Installing official Android command-line tools into ${SDK_ROOT}/cmdline-tools/latest..."
            CMDLINE_ZIP="/tmp/commandlinetools-linux.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$CMDLINE_ZIP"
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            unzip -q -o "$CMDLINE_ZIP" -d "${SDK_ROOT}/cmdline-tools"
            rm -rf "${SDK_ROOT}/cmdline-tools/latest"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
            rm -f "$CMDLINE_ZIP"
            SDKMANAGER_BIN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "::error::sdkmanager binary not found or not executable at $SDKMANAGER_BIN"
            exit 1
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "SDKMANAGER_BIN=${SDKMANAGER_BIN}" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          echo "Using ANDROID_SDK_ROOT=${SDK_ROOT}"
          echo "Using sdkmanager=${SDKMANAGER_BIN}"
          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --version

      - name: Accept All Android SDK Licenses Non-Interactively
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os
          import subprocess

          sdk_root = os.environ["ANDROID_SDK_ROOT"]
          sdkmanager = os.environ["SDKMANAGER_BIN"]
          licenses_dir = os.path.join(sdk_root, "licenses")
          os.makedirs(licenses_dir, exist_ok=True)

          # Write standard Android SDK license hashes deterministically
          standard_licenses = {
              "android-sdk-license": [
                  "8933bad161af4178b1185d1a37fbf41ea5269c55",
                  "d56f5187479451eabf01fb78af6dfcb131a6481e",
                  "24333f8a63b6825ea9c5514f83c2829b004d1fee",
              ],
              "android-sdk-preview-license": [
                  "84831b9409646a918e30573bab4c9c91346d8abd",
                  "504667f4c0de7af1a06de9f4b1727b84351f2910",
              ],
              "android-googletv-license": [
                  "601085b94cd77f0b54ff86406957099ebe79c4d6",
              ],
              "android-googlexr-license": [
                  "ceff83576aac4f7f37cb98fe189e9fb3c49d3b81",
              ],
              "android-sdk-arm-dbt-license": [
                  "859f317696f67ef3d7f30a50a5560e7834b43903",
              ],
              "google-gdk-license": [
                  "33b6a2b64607f11b759f320ef9dff4ae5c47d97a",
                  "d975f751698a77b662f1254ddbeed3901e976f5a",
              ],
              "microxr-sysimage-license": [
                  "3a7848b1d7366ca5cfa0be477627644ca73f47e3",
              ],
              "mips-android-sysimage-license": [
                  "e9acab5b5fbb560a72cfaecce8946896ff6aab9d",
              ],
          }

          for filename, hashes in standard_licenses.items():
              path = os.path.join(licenses_dir, filename)
              with open(path, "w", encoding="utf-8") as f:
                  for h in hashes:
                      f.write(f"\n{h}")
                  f.write("\n")

          # Run sdkmanager --licenses non-interactively with strict exit-code verification
          result = subprocess.run(
              [sdkmanager, f"--sdk_root={sdk_root}", "--licenses"],
              input="y\n" * 120,
              text=True,
              capture_output=True,
              check=True,
          )
          print("All Android SDK licenses accepted successfully.")
          PYEOF

      - name: Install Compatible Android SDK Platforms & Build Tools (API 36 / 36.1 & Build-Tools 36.0.0)
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os
          import subprocess

          sdk_root = os.environ["ANDROID_SDK_ROOT"]
          sdkmanager = os.environ["SDKMANAGER_BIN"]

          packages = [
              "platform-tools",
              "build-tools;36.0.0",
              "platforms;android-36",
              "platforms;android-36.1",
          ]

          print(f"Installing Android SDK packages: {packages}")
          subprocess.run(
              [sdkmanager, f"--sdk_root={sdk_root}", *packages],
              input="y\n" * 120,
              text=True,
              check=True,
          )

          required_paths = [
              os.path.join(sdk_root, "platforms", "android-36"),
              os.path.join(sdk_root, "platforms", "android-36.1"),
              os.path.join(sdk_root, "build-tools", "36.0.0", "aapt2"),
              os.path.join(sdk_root, "build-tools", "36.0.0", "apksigner"),
          ]
          for req in required_paths:
              if not os.path.exists(req):
                  raise SystemExit(f"Required Android SDK component missing after installation: {req}")

          print("Verified Android SDK platforms (36 & 36.1) and build-tools (36.0.0) are ready.")
          PYEOF

      - name: Setup Gradle 9.3.1 (Compatible with AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Environment Config & Verify Compatible Signing Keystore (debug.keystore)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp ".env.example" ".env"
              echo "Created .env from .env.example for Secrets Gradle Plugin"
            else
              touch ".env"
            fi
          fi

          python3 - << 'PYEOF'
          import base64
          import os
          import re
          import subprocess
          import sys

          keystore_path = "debug.keystore"
          b64_file_path = "debug.keystore.base64"
          secret_b64 = os.environ.get("DEBUG_KEYSTORE_BASE64", "").strip()

          source_used = None

          def fail_with_guidance(reason: str) -> None:
              if os.path.exists(keystore_path) and source_used in ("secret", "file_b64"):
                  try:
                      os.remove(keystore_path)
                  except OSError:
                      pass
              print(f"::error::{reason}", file=sys.stderr)
              print(
                  "::error::How to fix: Encode your original debug.keystore to Base64 locally and add it in GitHub: "
                  "Settings -> Secrets and variables -> Actions -> New repository secret (Name: DEBUG_KEYSTORE_BASE64). "
                  "Never generate a random replacement keystore, as doing so changes the signing certificate and causes "
                  "INSTALL_FAILED_UPDATE_INCOMPATIBLE on existing user devices.",
                  file=sys.stderr,
              )
              sys.exit(1)

          if secret_b64:
              source_used = "secret"
              try:
                  cleaned = re.sub(r"\s+", "", secret_b64)
                  decoded_bytes = base64.b64decode(cleaned, validate=True)
              except Exception:
                  fail_with_guidance(
                      "GitHub Actions secret DEBUG_KEYSTORE_BASE64 is not valid Base64 content."
                  )
              if not decoded_bytes or len(decoded_bytes) < 64:
                  fail_with_guidance(
                      "Decoded DEBUG_KEYSTORE_BASE64 content is empty or truncated."
                  )
              with open(keystore_path, "wb") as kf:
                  kf.write(decoded_bytes)
              os.chmod(keystore_path, 0o600)
              print("Restored debug.keystore securely from GitHub Actions secret DEBUG_KEYSTORE_BASE64.")
          elif os.path.isfile(b64_file_path) and os.path.getsize(b64_file_path) > 0:
              source_used = "file_b64"
              try:
                  with open(b64_file_path, "r", encoding="utf-8") as bf:
                      cleaned = re.sub(r"\s+", "", bf.read())
                  decoded_bytes = base64.b64decode(cleaned, validate=True)
              except Exception:
                  fail_with_guidance(
                      "Repository file debug.keystore.base64 is not valid Base64 content."
                  )
              if not decoded_bytes or len(decoded_bytes) < 64:
                  fail_with_guidance(
                      "Decoded debug.keystore.base64 content is empty or truncated."
                  )
              with open(keystore_path, "wb") as kf:
                  kf.write(decoded_bytes)
              os.chmod(keystore_path, 0o600)
              print("Restored debug.keystore from repository file debug.keystore.base64.")
          elif os.path.isfile(keystore_path) and os.path.getsize(keystore_path) > 0:
              source_used = "existing_file"
              print("Using existing debug.keystore file in workspace.")
          else:
              fail_with_guidance(
                  "Signing keystore is missing! Neither GitHub Actions secret DEBUG_KEYSTORE_BASE64 nor debug.keystore.base64 was found."
              )

          # Validate keystore format, alias (androiddebugkey), and extract SHA-256 certificate fingerprint
          proc = subprocess.run(
              [
                  "keytool",
                  "-list",
                  "-v",
                  "-keystore",
                  keystore_path,
                  "-storepass",
                  "android",
                  "-alias",
                  "androiddebugkey",
              ],
              text=True,
              capture_output=True,
          )

          if proc.returncode != 0:
              fail_with_guidance(
                  "Restored debug.keystore failed verification with keytool (invalid keystore format, wrong storepass, or missing alias 'androiddebugkey')."
              )

          sha256_match = re.search(
              r"SHA256:\s*([0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){31})",
              proc.stdout,
          )
          if not sha256_match:
              fail_with_guidance(
                  "Unable to read SHA-256 certificate fingerprint for alias 'androiddebugkey' from debug.keystore."
              )

          cert_sha256 = sha256_match.group(1).upper()
          approved_cert_sha256 = "1F:F7:75:2A:F4:96:A6:A7:4F:DF:5F:62:07:10:C7:47:83:03:1E:83:4B:2D:6D:A0:5A:AD:DB:57:A1:0D:11:05"
          if cert_sha256 != approved_cert_sha256:
              fail_with_guidance(
                  f"Keystore certificate SHA-256 mismatch! Expected approved PMP PAINTS certificate ({approved_cert_sha256}), "
                  f"but found ({cert_sha256}). Refusing to build incompatible APK that would fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE."
              )

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as env_f:
                  env_f.write(f"KEYSTORE_CERT_SHA256={cert_sha256}\n")

          print(f"Verified valid debug.keystore (alias: androiddebugkey, SHA-256: {cert_sha256} matches approved PMP PAINTS certificate).")
          PYEOF

      - name: Resolve & Validate Version Metadata and Build Identity
        id: meta
        env:
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || github.event.client_payload.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || github.event.client_payload.version_name }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes || github.event.client_payload.release_notes }}
          INPUT_PUBLIC_BASE_URL: ${{ github.event.inputs.public_base_url || github.event.client_payload.public_base_url }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          repo = os.environ.get("GITHUB_REPOSITORY", "ow7ab/ow7ab")
          owner, repo_name = (repo.split("/", 1) + ["ow7ab"])[:2]
          git_sha_full = os.environ.get("GITHUB_SHA", "")
          git_commit = git_sha_full[:8] if git_sha_full else "9a8b7c6d"
          published_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          existing_code = 14
          existing_name = "v3.1"
          if os.path.exists("version.json"):
              try:
                  with open("version.json", "r", encoding="utf-8") as f:
                      prev = json.load(f)
                      existing_code = int(prev.get("versionCode", 14))
                      existing_name = str(prev.get("versionName", "v3.1")).strip()
              except Exception:
                  existing_code = 14

          v_code_str = os.environ.get("INPUT_VERSION_CODE", "").strip()
          v_name_str = os.environ.get("INPUT_VERSION_NAME", "").strip()
          notes_str = os.environ.get("INPUT_RELEASE_NOTES", "").strip()
          public_base = os.environ.get("INPUT_PUBLIC_BASE_URL", "").strip().rstrip("/")

          if not v_code_str:
              v_code = max(existing_code, 14)
          else:
              v_code = int(v_code_str)

          if v_code <= 0:
              raise SystemExit(f"Invalid versionCode: {v_code}")

          if not v_name_str:
              v_name_str = existing_name if v_code == existing_code and existing_name else f"v3.{v_code - 13}"

          v_clean = v_name_str.lstrip("vV").strip()

          if not notes_str:
              notes_str = f"إصدار PMP PAINTS v{v_clean} (بناء #{v_code} - Commit {git_commit})"

          build_id = f"PMP-v{v_clean}-b{v_code}-{git_commit}"
          apk_filename = f"pmp-paints-v{v_clean}-b{v_code}.apk"

          if not public_base:
              public_base = f"https://{owner}.github.io/{repo_name}"

          primary_download_url = f"{public_base}/{apk_filename}"
          github_release_url = f"https://github.com/{repo}/releases/download/v{v_clean}/{apk_filename}"

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env_file:
              env_file.write(f"V_CODE={v_code}\n")
              env_file.write(f"V_NAME={v_name_str}\n")
              env_file.write(f"GIT_COMMIT_SHORT={git_commit}\n")
              env_file.write(f"PUBLISHED_AT_UTC={published_at}\n")
              env_file.write(f"BUILD_ID={build_id}\n")
              env_file.write(f"APK_FILENAME={apk_filename}\n")
              env_file.write(f"PRIMARY_DOWNLOAD_URL={primary_download_url}\n")
              env_file.write(f"GITHUB_RELEASE_URL={github_release_url}\n")

          with open("/tmp/release_notes.txt", "w", encoding="utf-8") as nf:
              nf.write(notes_str)

          print(f"Resolved Build Identity: {build_id} -> {apk_filename}")
          PYEOF

      - name: Run Automated Unit & Update Verification Tests (Gate Before APK Build)
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "Running automated unit tests using ${GRADLE_CMD}..."
          ${GRADLE_CMD} :app:testDebugUnitTest \
            -PversionCode="${V_CODE}" \
            -PversionName="${V_NAME}" \
            -PgitCommit="${GIT_COMMIT_SHORT}" \
            -PbuildTimestampUtc="${PUBLISHED_AT_UTC}" \
            -PbuildId="${BUILD_ID}" \
            --no-daemon

      - name: Build Signed APK with Embedded Build Identity
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "Building APK using ${GRADLE_CMD}..."
          ${GRADLE_CMD} :app:assembleDebug \
            -PversionCode="${V_CODE}" \
            -PversionName="${V_NAME}" \
            -PgitCommit="${GIT_COMMIT_SHORT}" \
            -PbuildTimestampUtc="${PUBLISHED_AT_UTC}" \
            -PbuildId="${BUILD_ID}" \
            --no-daemon

      - name: Verify Compiled APK Binary (Package Name, Version, Signature & Checksum)
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::APK file was not generated at $APK_SOURCE"
            exit 1
          fi

          mkdir -p release_out public
          cp "$APK_SOURCE" "release_out/${APK_FILENAME}"
          cp "$APK_SOURCE" "release_out/pmp-paints-latest.apk"
          cp "$APK_SOURCE" "public/${APK_FILENAME}"
          cp "$APK_SOURCE" "public/pmp-paints-latest.apk"

          AAPT2_BIN="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          APKSIGNER_BIN="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ ! -x "$AAPT2_BIN" ]; then
            AAPT2_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name "aapt2" | sort -V | tail -n 1)
          fi
          if [ ! -x "$APKSIGNER_BIN" ]; then
            APKSIGNER_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n 1)
          fi

          echo "=== Verifying APK Manifest with aapt2 ==="
          BADGING_OUT=$("$AAPT2_BIN" dump badging "release_out/${APK_FILENAME}")
          echo "$BADGING_OUT" | grep "package: name="

          if ! echo "$BADGING_OUT" | grep -q "name='com.pmp'"; then
            echo "::error::APK packageName is not com.pmp!"
            exit 1
          fi
          if ! echo "$BADGING_OUT" | grep -q "versionCode='${V_CODE}'"; then
            echo "::error::APK versionCode does not match expected ${V_CODE}!"
            exit 1
          fi
          if ! echo "$BADGING_OUT" | grep -q "versionName='${V_NAME}'"; then
            echo "::error::APK versionName does not match expected ${V_NAME}!"
            exit 1
          fi

          echo "=== Verifying APK Cryptographic Signature with apksigner ==="
          CERT_OUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "release_out/${APK_FILENAME}")
          echo "$CERT_OUT"

          APK_CERT_SHA256=$(echo "$CERT_OUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT_HEX=$(echo "${KEYSTORE_CERT_SHA256}" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ -n "$APK_CERT_SHA256" ] && [ -n "$EXPECTED_CERT_HEX" ] && [ "$APK_CERT_SHA256" != "$EXPECTED_CERT_HEX" ]; then
            echo "::error::APK signing certificate ($APK_CERT_SHA256) does not match debug.keystore certificate ($EXPECTED_CERT_HEX)!"
            exit 1
          fi

          SHA256_HASH=$(sha256sum "release_out/${APK_FILENAME}" | awk '{print $1}')
          FILE_SIZE_BYTES=$(stat -c%s "release_out/${APK_FILENAME}")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${FILE_SIZE_BYTES}/1048576}")

          if [ "$FILE_SIZE_BYTES" -lt 1048576 ]; then
            echo "::error::APK file size (${FILE_SIZE_BYTES} bytes) is suspiciously small (< 1MB)!"
            exit 1
          fi

          echo "APK_SHA256=${SHA256_HASH}" >> "$GITHUB_ENV"
          echo "APK_SIZE_BYTES=${FILE_SIZE_BYTES}" >> "$GITHUB_ENV"
          echo "APK_SIZE_MB=${FILE_SIZE_MB}" >> "$GITHUB_ENV"

      - name: Generate Schema-Validated version.json Safely via Python
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json
          import os

          with open("/tmp/release_notes.txt", "r", encoding="utf-8") as nf:
              release_notes = nf.read().strip()

          v_code = int(os.environ["V_CODE"])
          v_name = os.environ["V_NAME"]
          sha256 = os.environ["APK_SHA256"]
          file_size_bytes = int(os.environ["APK_SIZE_BYTES"])
          file_size_mb = float(os.environ["APK_SIZE_MB"])
          build_id = os.environ["BUILD_ID"]
          git_commit = os.environ["GIT_COMMIT_SHORT"]
          published_at = os.environ["PUBLISHED_AT_UTC"]
          primary_url = os.environ["PRIMARY_DOWNLOAD_URL"]
          github_release_url = os.environ["GITHUB_RELEASE_URL"]
          cert_sha256 = os.environ.get("KEYSTORE_CERT_SHA256", "")

          payload = {
              "versionCode": v_code,
              "versionName": v_name,
              "downloadUrl": primary_url,
              "apkUrl": primary_url,
              "githubReleaseUrl": github_release_url,
              "releaseNotes": release_notes,
              "apkSha256": sha256,
              "sha256": sha256,
              "sha256Checksum": sha256,
              "apkSize": file_size_bytes,
              "fileSize": file_size_bytes,
              "fileSizeMb": file_size_mb,
              "minimumSupportedVersion": 1,
              "minSupportedVersion": 1,
              "minSupportedVersionCode": 1,
              "mandatoryUpdate": False,
              "isMandatory": False,
              "mandatory": False,
              "publishedAt": published_at,
              "releaseStatus": "PUBLISHED",
              "buildId": build_id,
              "gitCommit": git_commit,
              "signingCertSha256": cert_sha256
          }

          for out_path in ["version.json", "release_out/version.json", "public/version.json"]:
              with open(out_path, "w", encoding="utf-8") as out_f:
                  json.dump(payload, out_f, ensure_ascii=False, indent=2)
                  out_f.write("\n")

          # Validate JSON round-trip
          with open("release_out/version.json", "r", encoding="utf-8") as check_f:
              verified = json.load(check_f)
              assert verified["versionCode"] == v_code
              assert verified["apkSha256"] == sha256
              assert verified["apkSize"] == file_size_bytes
              assert verified["releaseStatus"] == "PUBLISHED"
              assert verified["buildId"] == build_id
          print("Generated and validated version.json:")
          print(json.dumps(verified, ensure_ascii=False, indent=2))
          PYEOF

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V_NAME }}
          name: "PMP PAINTS v${{ env.V_NAME }} (Build ${{ env.V_CODE }} • ${{ env.GIT_COMMIT_SHORT }})"
          body: |
            ### تحديث PMP PAINTS السحابي المعتمد
            - **الإصدار (versionName):** `${{ env.V_NAME }}`
            - **رقم البناء (versionCode):** `${{ env.V_CODE }}`
            - **معرّف البناء (Build ID):** `${{ env.BUILD_ID }}`
            - **Git Commit SHA:** `${{ env.GIT_COMMIT_SHORT }}`
            - **تاريخ النشر (UTC):** `${{ env.PUBLISHED_AT_UTC }}`
            - **الحجم:** `${{ env.APK_SIZE_MB }} MB` (`${{ env.APK_SIZE_BYTES }} bytes`)
            - **بصمة الملف (SHA-256):** `${{ env.APK_SHA256 }}`
            - **بصمة شهادة التوقيع (Cert SHA-256):** `${{ env.KEYSTORE_CERT_SHA256 }}`
          draft: false
          prerelease: false
          files: |
            release_out/${{ env.APK_FILENAME }}
            release_out/pmp-paints-latest.apk
            release_out/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Published Release Asset Download URL
        run: |
          set -euo pipefail
          echo "Verifying published GitHub Release asset reachability: ${GITHUB_RELEASE_URL}"
          HTTP_STATUS=$(curl -sL -o /tmp/probe_apk_head.bin -w "%{http_code}" -r 0-3 "${GITHUB_RELEASE_URL}" || echo "000")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "206" ]; then
            echo "Verified public GitHub Release URL is reachable (HTTP $HTTP_STATUS)."
          else
            echo "::warning::Direct unauthenticated probe returned HTTP $HTTP_STATUS (expected if repository is private; GitHub Pages deployment will serve public assets)."
          fi

      - name: Upload Public Artifacts for GitHub Pages Hosting
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy Public Release Endpoint to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
