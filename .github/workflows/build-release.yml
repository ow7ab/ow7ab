name: PMP Paints - Official Website & Automated Signed APK Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "رقم البناء الجديد (versionCode) - يزيد تلقائياً إذا كان مستخدماً مسبقاً"
        required: true
        default: "18"
      version_name:
        description: "اسم الإصدار (versionName) مثل 18.0"
        required: true
        default: "18.0"
      release_notes:
        description: "ملاحظات التحديث التي ستظهر للمستخدمين وعلى الموقع الرسمي"
        required: false
        default: "إصدار 18.0 (بناء 18): إطلاق الموقع الرسمي المتكامل ومنظومة الإصدارات الآلية، مع ترقية شاملة للأمان (PBKDF2، 2FA، عزل البصمة) وتفعيل R8/ProGuard."
      public_base_url:
        description: "رابط الاستضافة العامة الاختياري (يُستخدم GitHub Pages تلقائياً عند تركه فارغاً)"
        required: false
        default: ""
  repository_dispatch:
    types: [publish-apk-release]

permissions:
  contents: read

concurrency:
  group: pmp-release-and-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Verify, Publish APK & Deploy Official Website
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Change Scope & Sync Brand Visual Assets to Website
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os
          import shutil
          import subprocess

          # 1. Always sync official PMP brand drawable assets into public/assets/
          drawable_dir = os.path.join("app", "src", "main", "res", "drawable")
          public_assets_dir = os.path.join("public", "assets")
          os.makedirs(public_assets_dir, exist_ok=True)
          for asset_name in [
              "ic_pmp_emblem.png",
              "ic_pmp_emblem_solid.png",
              "pmp_brand_logo.jpg",
              "pmp_brand_poster.jpg",
              "pmp_reference_poster.jpg",
          ]:
              src = os.path.join(drawable_dir, asset_name)
              dst = os.path.join(public_assets_dir, asset_name)
              if os.path.isfile(src):
                  shutil.copy2(src, dst)
                  print(f"Synced brand asset: {src} -> {dst}")

          # 2. Detect whether this push modified only website/documentation files
          event_name = os.environ.get("EVENT_NAME", "")
          ref_name = os.environ.get("REF_NAME", "")
          before_sha = os.environ.get("BEFORE_SHA", "")
          current_sha = os.environ.get("CURRENT_SHA", "")

          website_only = False
          if event_name == "push" and not ref_name.startswith("v") and before_sha and before_sha != "0000000000000000000000000000000000000000":
              proc = subprocess.run(
                  ["git", "diff", "--name-only", before_sha, current_sha],
                  text=True,
                  capture_output=True,
              )
              if proc.returncode == 0:
                  changed_files = [line.strip() for line in proc.stdout.splitlines() if line.strip()]
                  print(f"Changed files in push ({len(changed_files)}): {changed_files}")
                  if changed_files and all(
                      f.startswith("public/")
                      or f.startswith("web/")
                      or f.startswith("desktop/")
                      or f in (
                          "README.md",
                          "DEPLOYMENT.md",
                          "DESKTOP.md",
                          "firebase.json",
                          "wrangler.toml",
                          ".gitignore",
                          ".github/workflows/deploy-web.yml",
                          ".github/workflows/build-release.yml",
                          ".github/workflows/build-desktop.yml",
                      )
                      for f in changed_files
                  ):
                      website_only = True

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as ef:
              ef.write(f"WEBSITE_ONLY={'true' if website_only else 'false'}\n")

          out_path = os.environ.get("GITHUB_OUTPUT")
          if out_path:
              with open(out_path, "a", encoding="utf-8") as of:
                  of.write(f"website_only={'true' if website_only else 'false'}\n")

          if website_only:
              print("Detected website-only change (public/** or README.md). Will redeploy official website without rebuilding Android APK.")
          else:
              print("Detected Android/workflow/release change. Running full test, build, sign, verify, and release pipeline.")
          PYEOF

      - name: Set up JDK 21 (Required for AGP 9.1.1 & Android SDK Command-Line Tools)
        if: env.WEBSITE_ONLY != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Locate Android SDK & Verify sdkmanager Path
        if: env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ]; then
            sudo mkdir -p "$SDK_ROOT"
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT"
          else
            mkdir -p "$SDK_ROOT"
          fi

          SDKMANAGER_BIN=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_BIN=$(find "$SDK_ROOT/cmdline-tools" -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$FOUND_BIN" ] && [ -x "$FOUND_BIN" ]; then
              SDKMANAGER_BIN="$FOUND_BIN"
            fi
          fi

          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "Installing official Android command-line tools into ${SDK_ROOT}/cmdline-tools/latest..."
            CMDLINE_ZIP="/tmp/commandlinetools-linux.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$CMDLINE_ZIP"
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            unzip -q -o "$CMDLINE_ZIP" -d "${SDK_ROOT}/cmdline-tools"
            rm -rf "${SDK_ROOT}/cmdline-tools/latest"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
            rm -f "$CMDLINE_ZIP"
            SDKMANAGER_BIN="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "::error::sdkmanager binary not found or not executable at $SDKMANAGER_BIN"
            exit 1
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "SDKMANAGER_BIN=${SDKMANAGER_BIN}" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          echo "Using ANDROID_SDK_ROOT=${SDK_ROOT}"
          echo "Using sdkmanager=${SDKMANAGER_BIN}"
          "$SDKMANAGER_BIN" --sdk_root="$SDK_ROOT" --version

      - name: Accept All Android SDK Licenses Non-Interactively
        if: env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os
          import subprocess

          sdk_root = os.environ["ANDROID_SDK_ROOT"]
          sdkmanager = os.environ["SDKMANAGER_BIN"]
          licenses_dir = os.path.join(sdk_root, "licenses")
          os.makedirs(licenses_dir, exist_ok=True)

          # Write standard Android SDK license hashes deterministically
          standard_licenses = {
              "android-sdk-license": [
                  "8933bad161af4178b1185d1a37fbf41ea5269c55",
                  "d56f5187479451eabf01fb78af6dfcb131a6481e",
                  "24333f8a63b6825ea9c5514f83c2829b004d1fee",
              ],
              "android-sdk-preview-license": [
                  "84831b9409646a918e30573bab4c9c91346d8abd",
                  "504667f4c0de7af1a06de9f4b1727b84351f2910",
              ],
              "android-googletv-license": [
                  "601085b94cd77f0b54ff86406957099ebe79c4d6",
              ],
              "android-googlexr-license": [
                  "ceff83576aac4f7f37cb98fe189e9fb3c49d3b81",
              ],
              "android-sdk-arm-dbt-license": [
                  "859f317696f67ef3d7f30a50a5560e7834b43903",
              ],
              "google-gdk-license": [
                  "33b6a2b64607f11b759f320ef9dff4ae5c47d97a",
                  "d975f751698a77b662f1254ddbeed3901e976f5a",
              ],
              "microxr-sysimage-license": [
                  "3a7848b1d7366ca5cfa0be477627644ca73f47e3",
              ],
              "mips-android-sysimage-license": [
                  "e9acab5b5fbb560a72cfaecce8946896ff6aab9d",
              ],
          }

          for filename, hashes in standard_licenses.items():
              path = os.path.join(licenses_dir, filename)
              with open(path, "w", encoding="utf-8") as f:
                  for h in hashes:
                      f.write(f"\n{h}")
                  f.write("\n")

          # Run sdkmanager --licenses non-interactively with strict exit-code verification
          subprocess.run(
              [sdkmanager, f"--sdk_root={sdk_root}", "--licenses"],
              input="y\n" * 120,
              text=True,
              capture_output=True,
              check=True,
          )
          print("All Android SDK licenses accepted successfully.")
          PYEOF

      - name: Install Compatible Android SDK Platforms & Build Tools (API 36 / 36.1 & Build-Tools 36.0.0)
        if: env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os
          import subprocess

          sdk_root = os.environ["ANDROID_SDK_ROOT"]
          sdkmanager = os.environ["SDKMANAGER_BIN"]

          packages = [
              "platform-tools",
              "build-tools;36.0.0",
              "platforms;android-36",
              "platforms;android-36.1",
          ]

          print(f"Installing Android SDK packages: {packages}")
          subprocess.run(
              [sdkmanager, f"--sdk_root={sdk_root}", *packages],
              input="y\n" * 120,
              text=True,
              check=True,
          )

          required_paths = [
              os.path.join(sdk_root, "platforms", "android-36"),
              os.path.join(sdk_root, "platforms", "android-36.1"),
              os.path.join(sdk_root, "build-tools", "36.0.0", "aapt2"),
              os.path.join(sdk_root, "build-tools", "36.0.0", "apksigner"),
          ]
          for req in required_paths:
              if not os.path.exists(req):
                  raise SystemExit(f"Required Android SDK component missing after installation: {req}")

          print("Verified Android SDK platforms (36 & 36.1) and build-tools (36.0.0) are ready.")
          PYEOF

      - name: Setup Gradle 9.3.1 (Compatible with AGP 9.1.1)
        if: env.WEBSITE_ONLY != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Environment Config & Verify Compatible Signing Keystore (debug.keystore)
        if: env.WEBSITE_ONLY != 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEFAULT_WEB_CLIENT_ID_SECRET: ${{ secrets.DEFAULT_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp ".env.example" ".env"
              echo "Created .env from .env.example for Secrets Gradle Plugin"
            else
              touch ".env"
            fi
          fi

          python3 - << 'PYEOF'
          import base64
          import os
          import re
          import subprocess
          import sys

          keystore_path = "debug.keystore"
          b64_file_path = "debug.keystore.base64"
          secret_b64 = os.environ.get("DEBUG_KEYSTORE_BASE64", "").strip()

          source_used = None

          def fail_with_guidance(reason: str) -> None:
              if os.path.exists(keystore_path) and source_used in ("secret", "file_b64"):
                  try:
                      os.remove(keystore_path)
                  except OSError:
                      pass
              print(f"::error::{reason}", file=sys.stderr)
              print(
                  "::error::How to fix: Encode your original debug.keystore to Base64 locally and add it in GitHub: "
                  "Settings -> Secrets and variables -> Actions -> New repository secret (Name: DEBUG_KEYSTORE_BASE64). "
                  "Never generate a random replacement keystore, as doing so changes the signing certificate and causes "
                  "INSTALL_FAILED_UPDATE_INCOMPATIBLE on existing user devices.",
                  file=sys.stderr,
              )
              sys.exit(1)

          def clean_b64_input(raw: str) -> str:
              stripped = re.sub(r"```[a-zA-Z0-9_-]*", "", raw)
              stripped = stripped.replace("```", "").replace('"', "").replace("'", "")
              return re.sub(r"\s+", "", stripped)

          decoded_bytes = None
          if secret_b64:
              cleaned = clean_b64_input(secret_b64)
              try:
                  candidate = base64.b64decode(cleaned, validate=True)
                  if candidate and len(candidate) >= 64:
                      decoded_bytes = candidate
                      source_used = "secret"
                      with open(keystore_path, "wb") as kf:
                          kf.write(decoded_bytes)
                      os.chmod(keystore_path, 0o600)
                      print("Restored debug.keystore securely from GitHub Actions secret DEBUG_KEYSTORE_BASE64.")
                  else:
                      print("::warning::DEBUG_KEYSTORE_BASE64 secret was empty or truncated; checking repository fallback.")
              except Exception:
                  print("::warning::DEBUG_KEYSTORE_BASE64 secret was not valid Base64; checking repository fallback.")

          if decoded_bytes is None and os.path.isfile(b64_file_path) and os.path.getsize(b64_file_path) > 0:
              source_used = "file_b64"
              try:
                  with open(b64_file_path, "r", encoding="utf-8") as bf:
                      cleaned = clean_b64_input(bf.read())
                  decoded_bytes = base64.b64decode(cleaned, validate=True)
              except Exception:
                  fail_with_guidance(
                      "Repository file debug.keystore.base64 is not valid Base64 content."
                  )
              if not decoded_bytes or len(decoded_bytes) < 64:
                  fail_with_guidance(
                      "Decoded debug.keystore.base64 content is empty or truncated."
                  )
              with open(keystore_path, "wb") as kf:
                  kf.write(decoded_bytes)
              os.chmod(keystore_path, 0o600)
              print("Restored debug.keystore from repository file debug.keystore.base64.")
          elif decoded_bytes is None and os.path.isfile(keystore_path) and os.path.getsize(keystore_path) > 0:
              source_used = "existing_file"
              print("Using existing debug.keystore file in workspace.")
          elif decoded_bytes is None:
              if secret_b64:
                  fail_with_guidance(
                      "GitHub Actions secret DEBUG_KEYSTORE_BASE64 is not valid Base64 content and no fallback debug.keystore.base64 was found."
                  )
              else:
                  fail_with_guidance(
                      "Signing keystore is missing! Neither GitHub Actions secret DEBUG_KEYSTORE_BASE64 nor debug.keystore.base64 was found."
                  )

          proc = subprocess.run(
              [
                  "keytool",
                  "-list",
                  "-v",
                  "-keystore",
                  keystore_path,
                  "-storepass",
                  "android",
                  "-alias",
                  "androiddebugkey",
              ],
              text=True,
              capture_output=True,
          )

          if proc.returncode != 0:
              fail_with_guidance(
                  "Restored debug.keystore failed verification with keytool (invalid keystore format, wrong storepass, or missing alias 'androiddebugkey')."
              )

          sha256_match = re.search(
              r"SHA256:\s*([0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){31})",
              proc.stdout,
          )
          if not sha256_match:
              fail_with_guidance(
                  "Unable to read SHA-256 certificate fingerprint for alias 'androiddebugkey' from debug.keystore."
              )

          cert_sha256 = sha256_match.group(1).upper()
          approved_cert_sha256 = "1F:F7:75:2A:F4:96:A6:A7:4F:DF:5F:62:07:10:C7:47:83:03:1E:83:4B:2D:6D:A0:5A:AD:DB:57:A1:0D:11:05"
          if cert_sha256 != approved_cert_sha256:
              fail_with_guidance(
                  f"Keystore certificate SHA-256 mismatch! Expected approved PMP PAINTS certificate ({approved_cert_sha256}), "
                  f"but found ({cert_sha256}). Refusing to build incompatible APK that would fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE."
              )

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as env_f:
                  env_f.write(f"KEYSTORE_CERT_SHA256={cert_sha256}\n")

          print(f"Verified valid debug.keystore (alias: androiddebugkey, SHA-256: {cert_sha256} matches approved PMP PAINTS certificate).")

          import json as _json
          gs_path = os.path.join("app", "google-services.json")
          gs_b64 = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "").strip()
          gs_raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          default_web_client_id = (
              os.environ.get("DEFAULT_WEB_CLIENT_ID_SECRET", "").strip()
              or "675531579375-732a74lc8b5r1ilu568geaigi1u6rb0i.apps.googleusercontent.com"
          )

          if not os.path.isfile(gs_path):
              if gs_b64:
                  try:
                      decoded_gs = base64.b64decode(clean_b64_input(gs_b64), validate=True).decode("utf-8")
                      _json.loads(decoded_gs)
                      with open(gs_path, "w", encoding="utf-8") as gf:
                          gf.write(decoded_gs)
                      os.chmod(gs_path, 0o600)
                      print("Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret.")
                  except Exception as exc:
                      print(f"::warning::Failed to decode GOOGLE_SERVICES_JSON_BASE64: {exc}")
              elif gs_raw:
                  try:
                      _json.loads(gs_raw)
                      with open(gs_path, "w", encoding="utf-8") as gf:
                          gf.write(gs_raw)
                      os.chmod(gs_path, 0o600)
                      print("Restored app/google-services.json from GOOGLE_SERVICES_JSON secret.")
                  except Exception as exc:
                      print(f"::warning::Failed to parse GOOGLE_SERVICES_JSON: {exc}")

          if os.path.isfile(gs_path):
              try:
                  with open(gs_path, "r", encoding="utf-8") as gf:
                      gs_data = _json.load(gf)
                  modified_gs = False
                  for client in gs_data.get("client", []):
                      pkg = (
                          client.get("client_info", {})
                          .get("android_client_info", {})
                          .get("package_name", "")
                      )
                      if pkg in ("com.aistudio.pmppaints.erp", "com.pmp"):
                          oauth_list = client.setdefault("oauth_client", [])
                          web_clients = [c for c in oauth_list if c.get("client_type") == 3 and c.get("client_id")]
                          if web_clients:
                              default_web_client_id = web_clients[0]["client_id"]
                          else:
                              oauth_list.append({"client_id": default_web_client_id, "client_type": 3})
                              modified_gs = True
                  if modified_gs:
                      with open(gs_path, "w", encoding="utf-8") as gf:
                          _json.dump(gs_data, gf, indent=2)
                          gf.write("\n")
                      print("Ensured Web OAuth 2.0 client (client_type 3) is present in app/google-services.json for com.aistudio.pmppaints.erp.")
              except Exception as exc:
                  print(f"::warning::Unable to inspect app/google-services.json: {exc}")

          if github_env:
              with open(github_env, "a", encoding="utf-8") as env_f:
                  env_f.write(f"DEFAULT_WEB_CLIENT_ID={default_web_client_id}\n")
          print("Verified Web OAuth 2.0 client configuration for R.string.default_web_client_id.")
          PYEOF

      - name: Resolve & Validate Monotonic Version Metadata and Build Identity
        if: env.WEBSITE_ONLY != 'true'
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code || github.event.client_payload.version_code }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name || github.event.client_payload.version_name }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes || github.event.client_payload.release_notes }}
          INPUT_PUBLIC_BASE_URL: ${{ github.event.inputs.public_base_url || github.event.client_payload.public_base_url }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ.get("GITHUB_REPOSITORY", "ow7ab/ow7ab")
          owner, repo_name = (repo.split("/", 1) + ["ow7ab"])[:2]
          git_sha_full = os.environ.get("GITHUB_SHA", "")
          git_commit = git_sha_full[:8] if git_sha_full else "9a8b7c6d"
          published_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          # 1. Read configured versionCode and versionName from app/build.gradle.kts
          gradle_code = 18
          gradle_name = "18.0"
          if os.path.exists("app/build.gradle.kts"):
              try:
                  with open("app/build.gradle.kts", "r", encoding="utf-8") as gf:
                      gradle_text = gf.read()
                  m_code = re.search(r"versionCode\s*=\s*(\d+)", gradle_text)
                  m_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)
                  if m_code:
                      gradle_code = int(m_code.group(1))
                  if m_name:
                      gradle_name = m_name.group(1).strip()
              except Exception:
                  pass

          # 2. Read last published versionCode from version.json
          existing_code = 17
          existing_name = "v4.2"
          if os.path.exists("version.json"):
              try:
                  with open("version.json", "r", encoding="utf-8") as f:
                      prev = json.load(f)
                      existing_code = int(prev.get("versionCode", 17))
                      existing_name = str(prev.get("versionName", "v4.2")).strip()
              except Exception:
                  existing_code = 17

          # 3. Query GitHub Releases API to discover highest already-published versionCode
          highest_github_release_code = existing_code
          gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=30",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "PMP-Paints-Release-Pipeline",
                      **({"Authorization": f"Bearer {gh_token}"} if gh_token else {}),
                  },
              )
              with urllib.request.urlopen(req, timeout=10) as resp:
                  if resp.status == 200:
                      releases_data = json.loads(resp.read().decode("utf-8"))
                      if isinstance(releases_data, list):
                          for rel in releases_data:
                              if not isinstance(rel, dict):
                                  continue
                              if rel.get("draft") or rel.get("prerelease"):
                                  continue
                              title_and_body = f"{rel.get('name', '')} {rel.get('body', '')}"
                              for m in re.finditer(r"(?:Build|versionCode|b|#)\s*[:=`]*\s*(\d+)", title_and_body, re.IGNORECASE):
                                  code_val = int(m.group(1))
                                  if 1 <= code_val < 100000 and code_val > highest_github_release_code:
                                      highest_github_release_code = code_val
                              for asset in rel.get("assets", []) or []:
                                  aname = str(asset.get("name", ""))
                                  am = re.search(r"-b(\d+)\.apk", aname, re.IGNORECASE)
                                  if am:
                                      code_val = int(am.group(1))
                                      if code_val > highest_github_release_code:
                                          highest_github_release_code = code_val
          except Exception as exc:
              print(f"Note: GitHub Releases lookup skipped or unavailable ({exc}); using repository metadata.")

          highest_published_code = max(existing_code, highest_github_release_code)
          v_code_str = os.environ.get("INPUT_VERSION_CODE", "").strip()
          v_name_str = os.environ.get("INPUT_VERSION_NAME", "").strip()
          notes_str = os.environ.get("INPUT_RELEASE_NOTES", "").strip()
          public_base = os.environ.get("INPUT_PUBLIC_BASE_URL", "").strip().rstrip("/")

          # Monotonically increasing versionCode strategy:
          # Ensure new release versionCode is strictly greater than any previously published release
          if not v_code_str:
              v_code = max(gradle_code, highest_published_code + 1, 18)
          else:
              requested_code = int(v_code_str)
              v_code = max(requested_code, highest_published_code + 1) if requested_code <= highest_published_code else requested_code

          if v_code <= 0:
              raise SystemExit(f"Invalid versionCode: {v_code}")

          if not v_name_str or (v_code_str and int(v_code_str) != v_code):
              if v_code == gradle_code and gradle_name:
                  v_name_str = gradle_name
              else:
                  v_name_str = f"{v_code}.0"

          v_clean = v_name_str.lstrip("vV").strip()

          if not notes_str:
              notes_str = f"إصدار PMP PAINTS v{v_clean} (بناء #{v_code} - Commit {git_commit}): تحديث رسمي موقّع ومتحقق منه عبر GitHub Actions."

          build_id = f"PMP-v{v_clean}-b{v_code}-{git_commit}"
          apk_filename = f"pmp-paints-v{v_clean}-b{v_code}.apk"

          if not public_base:
              public_base = f"https://{owner}.github.io/{repo_name}"

          pages_download_url = f"{public_base}/{apk_filename}"
          github_release_url = f"https://github.com/{repo}/releases/download/v{v_clean}/{apk_filename}"
          primary_download_url = github_release_url

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env_file:
              env_file.write(f"V_CODE={v_code}\n")
              env_file.write(f"V_NAME={v_name_str}\n")
              env_file.write(f"V_TAG=v{v_clean}\n")
              env_file.write(f"GIT_COMMIT_SHORT={git_commit}\n")
              env_file.write(f"PUBLISHED_AT_UTC={published_at}\n")
              env_file.write(f"BUILD_ID={build_id}\n")
              env_file.write(f"APK_FILENAME={apk_filename}\n")
              env_file.write(f"PRIMARY_DOWNLOAD_URL={primary_download_url}\n")
              env_file.write(f"PAGES_DOWNLOAD_URL={pages_download_url}\n")
              env_file.write(f"GITHUB_RELEASE_URL={github_release_url}\n")

          with open("/tmp/release_notes.txt", "w", encoding="utf-8") as nf:
              nf.write(notes_str)

          print(f"Resolved Monotonic Build Identity: {build_id} (versionCode={v_code}, versionName={v_name_str}) -> {apk_filename}")
          PYEOF

      - name: Run Automated Unit & Update Verification Tests (Gate Before APK Build)
        if: env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "Compiling Kotlin sources and running automated unit tests using ${GRADLE_CMD}..."
          ${GRADLE_CMD} :app:compileDebugKotlin :app:testDebugUnitTest \
            -PversionCode="${V_CODE}" \
            -PversionName="${V_NAME}" \
            -PgitCommit="${GIT_COMMIT_SHORT}" \
            -PbuildTimestampUtc="${PUBLISHED_AT_UTC}" \
            -PbuildId="${BUILD_ID}" \
            -PdefaultWebClientId="${DEFAULT_WEB_CLIENT_ID}" \
            --no-daemon

      - name: Build Signed APK with Embedded Build Identity
        if: env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "Building signed production APK using ${GRADLE_CMD}..."
          ${GRADLE_CMD} :app:assembleDebug \
            -PversionCode="${V_CODE}" \
            -PversionName="${V_NAME}" \
            -PgitCommit="${GIT_COMMIT_SHORT}" \
            -PbuildTimestampUtc="${PUBLISHED_AT_UTC}" \
            -PbuildId="${BUILD_ID}" \
            -PdefaultWebClientId="${DEFAULT_WEB_CLIENT_ID}" \
            --no-daemon

      - name: Verify Compiled APK Binary (Package Name, Version, Signature & Checksum)
        if: env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::APK file was not generated at $APK_SOURCE"
            exit 1
          fi

          mkdir -p release_out public
          cp "$APK_SOURCE" "release_out/${APK_FILENAME}"
          cp "$APK_SOURCE" "release_out/pmp-paints-latest.apk"
          cp "$APK_SOURCE" "public/${APK_FILENAME}"
          cp "$APK_SOURCE" "public/pmp-paints-latest.apk"

          AAPT2_BIN="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          APKSIGNER_BIN="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ ! -x "$AAPT2_BIN" ]; then
            AAPT2_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name "aapt2" | sort -V | tail -n 1)
          fi
          if [ ! -x "$APKSIGNER_BIN" ]; then
            APKSIGNER_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n 1)
          fi

          echo "=== Verifying APK Manifest with aapt2 ==="
          BADGING_OUT=$("$AAPT2_BIN" dump badging "release_out/${APK_FILENAME}")
          echo "$BADGING_OUT" | grep "package: name="

          if ! echo "$BADGING_OUT" | grep -q "name='com.aistudio.pmppaints.erp'"; then
            echo "::error::APK packageName is not com.aistudio.pmppaints.erp!"
            exit 1
          fi
          if ! echo "$BADGING_OUT" | grep -q "versionCode='${V_CODE}'"; then
            echo "::error::APK versionCode does not match expected ${V_CODE}!"
            exit 1
          fi
          if ! echo "$BADGING_OUT" | grep -q "versionName='${V_NAME}'"; then
            echo "::error::APK versionName does not match expected ${V_NAME}!"
            exit 1
          fi

          echo "=== Verifying APK Cryptographic Signature with apksigner ==="
          CERT_OUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "release_out/${APK_FILENAME}")
          echo "$CERT_OUT"

          APK_CERT_SHA256=$(echo "$CERT_OUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT_HEX=$(echo "${KEYSTORE_CERT_SHA256}" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ -n "$APK_CERT_SHA256" ] && [ -n "$EXPECTED_CERT_HEX" ] && [ "$APK_CERT_SHA256" != "$EXPECTED_CERT_HEX" ]; then
            echo "::error::APK signing certificate ($APK_CERT_SHA256) does not match debug.keystore certificate ($EXPECTED_CERT_HEX)!"
            exit 1
          fi

          SHA256_HASH=$(sha256sum "release_out/${APK_FILENAME}" | awk '{print $1}')
          FILE_SIZE_BYTES=$(stat -c%s "release_out/${APK_FILENAME}")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${FILE_SIZE_BYTES}/1048576}")

          if [ "$FILE_SIZE_BYTES" -lt 1048576 ]; then
            echo "::error::APK file size (${FILE_SIZE_BYTES} bytes) is suspiciously small (< 1MB)!"
            exit 1
          fi

          echo "APK_SHA256=${SHA256_HASH}" >> "$GITHUB_ENV"
          echo "APK_SIZE_BYTES=${FILE_SIZE_BYTES}" >> "$GITHUB_ENV"
          echo "APK_SIZE_MB=${FILE_SIZE_MB}" >> "$GITHUB_ENV"

      - name: Generate Schema-Validated version.json & releases-history.json Safely via Python
        if: env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json
          import os

          with open("/tmp/release_notes.txt", "r", encoding="utf-8") as nf:
              release_notes = nf.read().strip()

          v_code = int(os.environ["V_CODE"])
          v_name = os.environ["V_NAME"]
          sha256 = os.environ["APK_SHA256"]
          file_size_bytes = int(os.environ["APK_SIZE_BYTES"])
          file_size_mb = float(os.environ["APK_SIZE_MB"])
          build_id = os.environ["BUILD_ID"]
          git_commit = os.environ["GIT_COMMIT_SHORT"]
          published_at = os.environ["PUBLISHED_AT_UTC"]
          primary_url = os.environ["PRIMARY_DOWNLOAD_URL"]
          pages_url = os.environ.get("PAGES_DOWNLOAD_URL", primary_url)
          github_release_url = os.environ["GITHUB_RELEASE_URL"]
          cert_sha256 = os.environ.get("KEYSTORE_CERT_SHA256", "")

          payload = {
              "versionCode": v_code,
              "versionName": v_name,
              "downloadUrl": primary_url,
              "apkUrl": pages_url,
              "pagesDownloadUrl": pages_url,
              "githubReleaseUrl": github_release_url,
              "releaseNotes": release_notes,
              "apkSha256": sha256,
              "sha256": sha256,
              "sha256Checksum": sha256,
              "apkSize": file_size_bytes,
              "fileSize": file_size_bytes,
              "fileSizeMb": file_size_mb,
              "minimumSupportedVersion": 1,
              "minSupportedVersion": 1,
              "minSupportedVersionCode": 1,
              "mandatoryUpdate": False,
              "isMandatory": False,
              "mandatory": False,
              "publishedAt": published_at,
              "releaseStatus": "PUBLISHED",
              "buildId": build_id,
              "gitCommit": git_commit,
              "signingCertSha256": cert_sha256
          }

          for out_path in ["version.json", "release_out/version.json", "public/version.json"]:
              with open(out_path, "w", encoding="utf-8") as out_f:
                  json.dump(payload, out_f, ensure_ascii=False, indent=2)
                  out_f.write("\n")

          # Update public/releases-history.json so the official website always has the full release history
          history_path = os.path.join("public", "releases-history.json")
          existing_releases = []
          if os.path.isfile(history_path):
              try:
                  with open(history_path, "r", encoding="utf-8") as hf:
                      hist_doc = json.load(hf)
                      if isinstance(hist_doc, dict) and isinstance(hist_doc.get("releases"), list):
                          existing_releases = hist_doc["releases"]
              except Exception:
                  existing_releases = []

          by_code = {}
          for item in existing_releases:
              if isinstance(item, dict) and item.get("versionCode"):
                  by_code[int(item["versionCode"])] = item

          by_code[v_code] = {
              "versionCode": v_code,
              "versionName": v_name if v_name.startswith("v") else f"v{v_name}",
              "buildId": build_id,
              "gitCommit": git_commit,
              "publishedAt": published_at,
              "fileSize": file_size_bytes,
              "fileSizeMb": file_size_mb,
              "apkSha256": sha256,
              "downloadUrl": github_release_url,
              "pagesDownloadUrl": pages_url,
              "releaseStatus": "PUBLISHED",
              "releaseNotes": release_notes,
          }

          sorted_releases = [by_code[k] for k in sorted(by_code.keys(), reverse=True)]
          history_doc = {
              "repository": os.environ.get("GITHUB_REPOSITORY", "ow7ab/ow7ab"),
              "applicationId": "com.aistudio.pmppaints.erp",
              "signingCertSha256": cert_sha256,
              "releases": sorted_releases,
          }
          with open(history_path, "w", encoding="utf-8") as hf:
              json.dump(history_doc, hf, ensure_ascii=False, indent=2)
              hf.write("\n")

          # Validate JSON round-trip
          with open("release_out/version.json", "r", encoding="utf-8") as check_f:
              verified = json.load(check_f)
              assert verified["versionCode"] == v_code
              assert verified["apkSha256"] == sha256
              assert verified["apkSize"] == file_size_bytes
              assert verified["releaseStatus"] == "PUBLISHED"
              assert verified["buildId"] == build_id
          print("Generated and validated version.json and public/releases-history.json:")
          print(json.dumps(verified, ensure_ascii=False, indent=2))
          PYEOF

      - name: Publish Release to GitHub Releases
        if: github.event_name != 'pull_request' && env.WEBSITE_ONLY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.V_TAG }}
          name: "PMP PAINTS ${{ env.V_TAG }} (Build ${{ env.V_CODE }} • ${{ env.GIT_COMMIT_SHORT }})"
          body: |
            ### تحديث PMP PAINTS السحابي المعتمد
            - **الإصدار (versionName):** `${{ env.V_NAME }}`
            - **رقم البناء (versionCode):** `${{ env.V_CODE }}`
            - **معرّف البناء (Build ID):** `${{ env.BUILD_ID }}`
            - **Git Commit SHA:** `${{ env.GIT_COMMIT_SHORT }}`
            - **تاريخ النشر (UTC):** `${{ env.PUBLISHED_AT_UTC }}`
            - **الحجم:** `${{ env.APK_SIZE_MB }} MB` (`${{ env.APK_SIZE_BYTES }} bytes`)
            - **بصمة الملف (SHA-256):** `${{ env.APK_SHA256 }}`
            - **بصمة شهادة التوقيع (Cert SHA-256):** `${{ env.KEYSTORE_CERT_SHA256 }}`
          draft: false
          prerelease: false
          files: |
            release_out/${{ env.APK_FILENAME }}
            release_out/pmp-paints-latest.apk
            release_out/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Published Release Asset Download URL
        if: github.event_name != 'pull_request' && env.WEBSITE_ONLY != 'true'
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os
          import urllib.request

          url = os.environ.get("GITHUB_RELEASE_URL", "")
          print(f"Verifying published GitHub Release asset reachability: {url}")
          req = urllib.request.Request(url, headers={"Range": "bytes=0-3", "User-Agent": "PMP-Release-Verifier"})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"Verified public GitHub Release URL is reachable (HTTP {resp.status}).")
          except Exception as exc:
              print(f"::warning::Direct unauthenticated probe returned ({exc}); GitHub Pages deployment will also serve public assets.")
          PYEOF

      - name: Set up Node.js for Unified Web Build
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package.json'

      - name: Build Unified ERP & Official APK Download Website
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import os
          import shutil

          os.makedirs(os.path.join("web", "public", "assets"), exist_ok=True)
          pub_assets = os.path.join("public", "assets")
          if os.path.isdir(pub_assets):
              for name in os.listdir(pub_assets):
                  src = os.path.join(pub_assets, name)
                  dst = os.path.join("web", "public", "assets", name)
                  if os.path.isfile(src):
                      shutil.copy2(src, dst)

          hist_src = os.path.join("public", "releases-history.json")
          if os.path.isfile(hist_src):
              shutil.copy2(hist_src, os.path.join("web", "public", "releases-history.json"))
          PYEOF

          npm ci --prefix web
          npm test --prefix web

          # 1. Build root bundle (/) and deploy to Cloudflare Pages if credentials are set
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            VITE_BASE_PATH=/ npm run build --prefix web
            CF_PROJ="${CLOUDFLARE_PROJECT_NAME:-pmp-paints-erp}"
            npx --yes wrangler@3 pages deploy web/dist --project-name="${CF_PROJ}" --branch=main --commit-dirty=true
          fi

          # 2. Build GitHub Pages bundle (/ow7ab/) and copy APK + version manifests into web/dist
          VITE_BASE_PATH=/ow7ab/ npm run build --prefix web
          python3 - << 'PYEOF'
          import glob
          import os
          import shutil

          for pattern in (os.path.join("public", "*.apk"), os.path.join("release_out", "*.apk")):
              for apk_file in glob.glob(pattern):
                  if os.path.isfile(apk_file):
                      shutil.copy2(apk_file, os.path.join("web", "dist", os.path.basename(apk_file)))

          for json_name in ("version.json", "releases-history.json"):
              src = os.path.join("public", json_name)
              if os.path.isfile(src):
                  shutil.copy2(src, os.path.join("web", "dist", json_name))
          PYEOF

      - name: Upload Unified Web Artifacts for GitHub Pages Hosting
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy Official Website & Release Portal to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4


